# =====================================================================
# AgroMarket — баптаулар
# ${DB_URL:...} — орта айнымалысы (environment variable) болса соны алады,
# болмаса қос нүктеден кейінгі әдепкі мәнді. Docker Compose-та айнымалылар .env файлынан келеді.
# =====================================================================

server:
  port: 8080

spring:
  application:
    name: agromarket-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agromarket}
    username: ${DB_USER:agromarket}
    password: ${DB_PASSWORD:agromarket}

  jpa:
    hibernate:
      # Кестелерді Hibernate емес, Flyway жасайды. Hibernate тек сәйкестігін тексереді.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # US-01: құжат пен фото 5 МБ-тан аспауы керек (әдепкі шек — 1 МБ)
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

agromarket:
  supported-regions:
    - Алматы
    - Астана
    - Алматы облысы
  payment:
    # Карта төлемінің провайдері. Ауыстыру үшін OrdersService-ті өзгерту керек емес.
    card-provider: STRIPE
  jwt:
    # Production-да міндетті түрде JWT_SECRET орта айнымалысы арқылы беріледі
    secret: ${JWT_SECRET:agromarket-dev-secret-change-me-at-least-32-bytes}
    ttl-minutes: 60
  storage:
    # MinIO мекенжайы. Бос болса, файлдар жадта сақталады (қайта іске қосқанда жоғалады)
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:agromarket}
    secret-key: ${MINIO_SECRET_KEY:agromarket123}
    bucket: ${MINIO_BUCKET:agromarket}
  # Бос дерекқорда демо пайдаланушылар мен өнімдерді жасау (DataSeeder)
  seed-demo-data: ${SEED_DEMO_DATA:true}
